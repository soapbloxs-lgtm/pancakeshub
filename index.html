<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pancakes Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<link id="favicon" rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

<style>
:root{--bg:#050508;--neon:#00fff7;--pink:#ff00ff;--text:#e6f7ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif}
body{background:radial-gradient(circle at top,#0a0a18,var(--bg));color:var(--text);overflow-x:hidden}

/* NEON GRID */
body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,255,247,0.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,0,255,0.08) 1px, transparent 1px);
background-size:60px 60px;
animation:gridMove 12s linear infinite;
z-index:-1
}

@keyframes gridMove{
0%{transform:translateY(0)}
100%{transform:translateY(60px)}
}

/* LOADING */
#loadingScreen{
position:fixed;
inset:0;
background:radial-gradient(circle at top,#0a0a18,#050508);
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
flex-direction:column
}

.loadingContent{text-align:center}

.loadingContent h1{
font-size:3.5rem;
color:var(--pink);
animation:textGlow 2s infinite alternate;
margin-bottom:20px
}

.loadBar{
margin:25px auto;
width:320px;
height:14px;
border-radius:30px;
overflow:hidden;
background:#111
}

.loadFill{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--neon),var(--pink));
animation:loadingFill 4s linear forwards
}

@keyframes loadingFill{from{width:0%}to{width:100%}}

@keyframes neonPulse{
0%{box-shadow:0 0 5px var(--neon)}
50%{box-shadow:0 0 20px var(--neon),0 0 40px var(--pink)}
100%{box-shadow:0 0 5px var(--neon)}
}

@keyframes textGlow{
0%{text-shadow:0 0 5px var(--pink)}
50%{text-shadow:0 0 25px var(--pink),0 0 40px var(--neon)}
100%{text-shadow:0 0 5px var(--pink)}
}

/* COVER */
.cover{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center
}

.cover h1{
font-size:4rem;
color:var(--pink);
animation:textGlow 2.5s infinite alternate
}

.cover button{
margin-top:20px;
padding:18px 40px;
border:3px solid var(--neon);
background:transparent;
color:var(--neon);
border-radius:12px;
cursor:pointer;
animation:neonPulse 3s infinite
}

/* NAV */
nav{
display:none;
text-align:center;
padding:15px;
border-bottom:1px solid rgba(0,255,247,.2)
}

nav button{
margin:6px;
padding:10px 20px;
border:2px solid var(--neon);
background:transparent;
color:var(--neon);
border-radius:8px;
cursor:pointer;
animation:neonPulse 3s infinite
}

/* TABS */
.tab{display:none;padding:25px;max-width:1500px;margin:auto}
.tab.active{display:block}

/* CONTROLS */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}

.controls input,
.controls select,
.controls button{
padding:10px;
border-radius:8px;
border:2px solid var(--pink);
background:black;
color:var(--pink)
}

/* GAME GRID */
.game-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:18px
}

.game-card{
border:2px solid var(--pink);
border-radius:14px;
overflow:hidden;
cursor:pointer;
transition:.25s;
animation:neonPulse 4s infinite
}

.game-card:hover{
transform:scale(1.05);
box-shadow:0 0 40px var(--pink),0 0 70px var(--neon)
}

.game-card img{
width:100%;
height:130px;
object-fit:cover
}

.game-card h3{
text-align:center;
padding:8px;
background:black;
color:var(--pink)
}

iframe{
width:100%;
height:75vh;
border:none;
border-radius:12px;
margin-top:20px
}

/* PANIC BUTTON */
.panicBtn{
position:fixed;
bottom:20px;
right:20px;
padding:12px 16px;
border:2px solid #1a73e8;
background:black;
color:#1a73e8;
border-radius:10px;
cursor:pointer;
z-index:9999
}

#classroomOverlay{
position:fixed;
inset:0;
background:#f1f3f4;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10000;
font-family:Arial
}

.loader{
width:40px;
height:40px;
border:4px solid #ccc;
border-top:4px solid #1a73e8;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:20px
}

@keyframes spin{to{transform:rotate(360deg)}}

/* AI */
.ai-container{
width:90%;
max-width:800px;
margin:auto;
background:#0a0a0a;
border:2px solid var(--neon);
border-radius:15px;
padding:15px;
box-shadow:0 0 20px var(--neon);
}

.chat-box{
height:400px;
overflow-y:auto;
background:black;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.message{padding:8px;margin:5px;border-radius:8px}
.user{background:#1e1e1e;color:var(--neon);text-align:right}
.bot{background:#111;color:#00ffcc;text-align:left}

.input-area{display:flex;gap:5px}
.input-area input{
flex:1;
padding:10px;
background:black;
border:2px solid var(--neon);
color:white;
border-radius:8px;
}
.input-area button{
background:transparent;
border:2px solid var(--pink);
color:var(--pink);
border-radius:8px;
cursor:pointer;
animation:neonPulse 3s infinite;
}
</style>
</head>

<body>

<!-- (ALL YOUR ORIGINAL HTML UNCHANGED ABOVE) -->

<nav id="navbar">
<button onclick="goHome()">Home</button>
<button onclick="showTab('games')">Games</button>
<button onclick="showTab('unblocker')">UnBlocker</button>

<!-- ✅ ADDED -->
<button onclick="showTab('ai')">AI</button>

</nav>

<!-- KEEP ALL YOUR ORIGINAL SECTIONS HERE -->

<!-- ✅ ADDED AI TAB -->
<section class="tab" id="ai">
<div class="ai-container">
<h2>🤖 Pancake AI</h2>
<div id="chatBox" class="chat-box"></div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>
</div>
</div>
</section>

<script>

/* KEEP ALL YOUR ORIGINAL SCRIPT ABOVE */

/* ✅ AI SCRIPT */
function sendMessage(){
let input=document.getElementById("userInput").value;
let chatBox=document.getElementById("chatBox");
if(input==="") return;

chatBox.innerHTML+=`<div class="message user">${input}</div>`;

let response=getAIResponse(input);

setTimeout(()=>{
chatBox.innerHTML+=`<div class="message bot">${response}</div>`;
chatBox.scrollTop=chatBox.scrollHeight;
},400);

document.getElementById("userInput").value="";
}

function getAIResponse(input){
input=input.toLowerCase();
if(input.includes("hello")) return "Hey 👋 welcome to Pancake AI!";
if(input.includes("games")) return "Check the Games tab 🔥";
if(input.includes("roblox")) return "Roblox is 🔥 what are you playing?";
return "I'm still learning... try something else!";
}

</script>

</body>
</html>
